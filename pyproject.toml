[project]
name = "lunar-lander"
version = "0.1.0"
description = "Reinforcement learning experiments for Gymnasium LunarLander"
readme = "README.md"
authors = [
    { name = "jt-manful", email = "johnmanful2002@hotmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "gymnasium[box2d,classic-control]>=1.4.0",
    "matplotlib>=3.11.2",
    "moviepy>=2.2.1",
    "numpy>=2.5.4",
    "stable-baselines3[extra]>=2.9.0",
    "tqdm>=4.70.1",
]

[project.scripts]
lunar-lander = "lunar_lander.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"
